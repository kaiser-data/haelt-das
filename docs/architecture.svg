<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img"
     aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Hält das? solution architecture</title>
  <desc id="d">A listing enters through the web app or the Chrome extension, the FastAPI server runs a six-stage
    pipeline (read listing, idealo lookup, deterministic checks, parallel evidence, cost per day, verdict) that calls
    Nebius Token Factory, idealo MCP, Tavily and a local data.gouv.fr index, stores the check in Supabase and streams
    events back to the UI as Server-Sent Events.</desc>
  <style>
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .group { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 5 4; }
    .h { font-size: 15px; font-weight: 650; fill: #1f2328; }
    .s { font-size: 12px; fill: #57606a; }
    .xs { font-size: 11px; fill: #57606a; }
    .col { font-size: 12px; font-weight: 700; fill: #8c959f; letter-spacing: .08em; }
    .spine { stroke: #1f2328; stroke-width: 2; fill: none; }
    .ret { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 4 6; animation: flow 1s linear infinite; }
    .glow { fill: none; stroke: #f59e0b; stroke-width: 3; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
      .anim { display: none; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <radialGradient id="dotg">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="680" fill="#ffffff"/>

  <!-- column labels -->
  <text class="col" x="30" y="30">CLIENTS</text>
  <text class="col" x="280" y="30">SERVER</text>
  <text class="col" x="540" y="30">PIPELINE · app/pipeline.py</text>
  <text class="col" x="960" y="30">SERVICES &amp; DATA</text>

  <!-- ============ connectors to services (drawn first, under boxes) ============ -->
  <g>
    <!-- Nebius -->
    <path id="c1" class="flow" stroke="#7c3aed" d="M900,80 C930,80 930,100 960,100"/>
    <path id="c5" class="flow" stroke="#7c3aed" d="M904,330 C935,330 930,140 960,140"/>
    <path id="c6" class="flow" stroke="#7c3aed" d="M900,432 C935,432 930,170 960,170"/>
    <path id="c8" class="flow" stroke="#7c3aed" d="M900,500 C938,500 930,195 960,195"/>
    <!-- idealo -->
    <path id="c2" class="flow" stroke="#ea580c" d="M900,160 C930,160 930,255 960,255"/>
    <path id="c7" class="flow" stroke="#ea580c" d="M900,448 C935,448 930,275 960,275"/>
    <!-- Tavily -->
    <path id="c4" class="flow" stroke="#0891b2" d="M904,350 C930,350 935,340 960,340"/>
    <path id="c1b" class="flow" stroke="#0891b2" d="M900,92 C945,92 925,325 960,325"/>
    <!-- data.gouv.fr -->
    <path id="c3" class="flow" stroke="#2563eb" d="M900,240 C935,240 925,415 960,415"/>
    <!-- Supabase -->
    <path id="c9" class="flow" stroke="#16a34a" d="M900,522 C930,522 930,500 960,500"/>
  </g>

  <!-- ============ clients ============ -->
  <rect class="box" x="30" y="53" width="200" height="64" rx="10"/>
  <text class="h" x="46" y="78">Web app · PWA</text>
  <text class="s" x="46" y="97">link · text · screenshot</text>
  <text class="xs" x="46" y="110">share target on the phone</text>
  <rect class="glow anim" x="30" y="53" width="200" height="64" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.03;0.05;1" values="1;1;0;0"/>
  </rect>

  <rect class="box" x="30" y="140" width="200" height="64" rx="10"/>
  <text class="h" x="46" y="165">Chrome extension</text>
  <text class="s" x="46" y="184">side panel reads the open</text>
  <text class="xs" x="46" y="197">product page (JSON-LD, images)</text>
  <rect class="glow anim" x="30" y="140" width="200" height="64" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.93;0.95;0.99;1" values="0;0;1;1;0"/>
  </rect>

  <!-- ============ server ============ -->
  <rect class="box" x="280" y="40" width="200" height="200" rx="10"/>
  <text class="h" x="296" y="66">FastAPI</text>
  <text class="xs" x="360" y="66">app/server.py</text>
  <text class="s" x="296" y="116">GET /  web app</text>
  <text class="s" x="296" y="138">POST /api/check → SSE</text>
  <text class="s" x="296" y="160">POST /api/replay</text>
  <text class="xs" x="296" y="176">  recorded runs (samples/batch)</text>
  <text class="xs" x="296" y="204">every model call logged</text>
  <text class="xs" x="296" y="218">in llm.py → shown in the UI</text>
  <rect class="glow anim" x="280" y="40" width="200" height="200" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.01;0.02;0.07;0.08;1" values="0;0;1;1;0;0"/>
  </rect>

  <!-- ============ main spine + SSE return ============ -->
  <path class="spine" d="M230,85 H520 V510" marker-end="url(#arr)"/>
  <path d="M520,160 H540 M520,235 H540 M520,340 H532 M520,440 H540" stroke="#1f2328" stroke-width="2"/>
  <path id="ret" class="ret" d="M520,535 V620 H130 V212" marker-end="url(#arrO)"/>
  <text class="s" x="150" y="642">Server-Sent Events: step · calls · verdict · saved → the UI prints the
    “receipt from the future” (cost per day over the expected life)</text>
  <path class="anim" d="M520,535 V620 H130 V212" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.77;0.79;0.95;0.97;1" values="0;0;1;1;0;0"/>
  </path>

  <!-- ============ pipeline stages ============ -->
  <!-- S1 -->
  <rect class="box" x="540" y="60" width="360" height="50" rx="10"/>
  <text class="h" x="556" y="82">1 · Read the listing</text>
  <text class="s" x="556" y="100">Tavily extract for links · Qwen / Gemma vision</text>
  <rect class="glow anim" x="540" y="60" width="360" height="50" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.06;0.09;0.17;1" values="0;0;1;0;0"/>
  </rect>
  <!-- S2 -->
  <rect class="box" x="540" y="135" width="360" height="50" rx="10"/>
  <text class="h" x="556" y="157">2 · Sold by real shops?</text>
  <text class="s" x="556" y="175">idealo: GTIN / exact match, branded equivalents</text>
  <rect class="glow anim" x="540" y="135" width="360" height="50" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.16;0.19;0.27;1" values="0;0;1;0;0"/>
  </rect>
  <!-- S3 -->
  <rect class="box" x="540" y="210" width="360" height="50" rx="10"/>
  <text class="h" x="556" y="232">3 · Deterministic checks</text>
  <text class="s" x="556" y="250">physics rules · sold as broken · FR durability index</text>
  <rect class="glow anim" x="540" y="210" width="360" height="50" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.26;0.29;0.37;1" values="0;0;1;0;0"/>
  </rect>
  <!-- S4 -->
  <rect class="group" x="532" y="282" width="376" height="114" rx="12"/>
  <text class="h" x="548" y="303">4 · Evidence in parallel</text>
  <text class="xs" x="745" y="303">asyncio, one branch may fail</text>
  <rect class="box" x="540" y="312" width="116" height="76" rx="8"/>
  <text class="h" x="550" y="334" font-size="13">Clones</text>
  <text class="xs" x="550" y="354">image search +</text>
  <text class="xs" x="550" y="369">vision compare</text>
  <rect class="box" x="662" y="312" width="116" height="76" rx="8"/>
  <text class="h" x="672" y="334" font-size="13">Failure reports</text>
  <text class="xs" x="672" y="354">DE · EN · FR</text>
  <text class="xs" x="672" y="369">classify + dedupe</text>
  <rect class="box" x="784" y="312" width="116" height="76" rx="8"/>
  <text class="h" x="794" y="334" font-size="13">Green claims</text>
  <text class="xs" x="794" y="354">certificates,</text>
  <text class="xs" x="794" y="369">EU Safety Gate</text>
  <rect class="glow anim" x="532" y="282" width="376" height="114" rx="12" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.41;0.56;0.62;1" values="0;0;1;1;0;0"/>
  </rect>
  <!-- S5 -->
  <rect class="box" x="540" y="415" width="360" height="50" rx="10"/>
  <text class="h" x="556" y="437">5 · Cost per day</text>
  <text class="s" x="556" y="455">life range + running costs · alternatives priced</text>
  <rect class="glow anim" x="540" y="415" width="360" height="50" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.63;0.66;0.73;1" values="0;0;1;0;0"/>
  </rect>
  <!-- S6 -->
  <rect class="box" x="540" y="485" width="360" height="50" rx="10"/>
  <text class="h" x="556" y="507">6 · Verdict (live)</text>
  <text class="s" x="556" y="525">BUY · AVOID · BUY_ALTERNATIVE · ASK + sources</text>
  <rect class="glow anim" x="540" y="485" width="360" height="50" rx="10" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.73;0.76;0.84;1" values="0;0;1;0;0"/>
  </rect>
  <text class="xs" x="540" y="560">Evidence tiers: A hard to fake (tests, shops, physics, official data) · B filtered</text>
  <text class="xs" x="540" y="575">user reports · C cheap signals (stars, marketing). Origin country is never a signal.</text>

  <!-- ============ services ============ -->
  <rect class="box" x="960" y="50" width="290" height="160" rx="10" style="stroke:#7c3aed"/>
  <text class="h" x="976" y="74">Nebius Token Factory</text>
  <text class="s" x="976" y="98">Qwen3-30B · read, classify, estimate</text>
  <text class="s" x="976" y="120">Gemma-3-27B · vision</text>
  <text class="s" x="976" y="142">Qwen3-Embedding-8B · dedupe</text>
  <text class="s" x="976" y="164">DeepSeek-V4-Pro · decide</text>
  <text class="xs" x="976" y="190">all calls through app/llm.py</text>

  <rect class="box" x="960" y="230" width="290" height="60" rx="10" style="stroke:#ea580c"/>
  <text class="h" x="976" y="254">idealo MCP</text>
  <text class="s" x="976" y="274">search · details · offers (OAuth)</text>

  <rect class="box" x="960" y="310" width="290" height="60" rx="10" style="stroke:#0891b2"/>
  <text class="h" x="976" y="334">Tavily</text>
  <text class="s" x="976" y="354">web search · page extract · images</text>

  <rect class="box" x="960" y="390" width="290" height="56" rx="10" style="stroke:#2563eb"/>
  <text class="h" x="976" y="413">data.gouv.fr index</text>
  <text class="s" x="976" y="432">local CSV, offline (app/fr_index.py)</text>

  <rect class="box" x="960" y="470" width="290" height="60" rx="10" style="stroke:#16a34a"/>
  <text class="h" x="976" y="494">Supabase <tspan class="xs">(optional)</tspan></text>
  <text class="s" x="976" y="514">stores every check (app/store.py)</text>

  <!-- connector highlights, in step with the stages -->
  <g class="anim" fill="none" stroke-width="3">
    <use href="#c1" stroke="#7c3aed" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.06;0.09;0.17;1" values="0;0;1;0;0"/></use>
    <use href="#c1b" stroke="#0891b2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.06;0.09;0.17;1" values="0;0;1;0;0"/></use>
    <use href="#c2" stroke="#ea580c" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.16;0.19;0.27;1" values="0;0;1;0;0"/></use>
    <use href="#c3" stroke="#2563eb" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.26;0.29;0.37;1" values="0;0;1;0;0"/></use>
    <use href="#c4" stroke="#0891b2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.41;0.56;0.62;1" values="0;0;1;1;0;0"/></use>
    <use href="#c5" stroke="#7c3aed" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.38;0.41;0.56;0.62;1" values="0;0;1;1;0;0"/></use>
    <use href="#c6" stroke="#7c3aed" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.63;0.66;0.73;1" values="0;0;1;0;0"/></use>
    <use href="#c7" stroke="#ea580c" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.63;0.66;0.73;1" values="0;0;1;0;0"/></use>
    <use href="#c8" stroke="#7c3aed" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.73;0.76;0.84;1" values="0;0;1;0;0"/></use>
    <use href="#c9" stroke="#16a34a" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.78;0.81;0.88;1" values="0;0;1;0;0"/></use>
  </g>

  <!-- the listing travelling through the system -->
  <g class="anim">
    <circle r="14" fill="url(#dotg)"/>
    <circle r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"
                   path="M230,85 H520 V620 H130 V204"
                   keyPoints="0;0.178;0.224;0.270;0.334;0.334;0.395;0.438;0.506;1;1"
                   keyTimes="0;0.08;0.18;0.28;0.40;0.55;0.65;0.75;0.80;0.95;1"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#57606a">
    <circle cx="960" cy="566" r="5" fill="#f59e0b"/>
    <text x="972" y="570">one listing moving through the check</text>
    <line x1="954" y1="588" x2="968" y2="588" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="972" y="592">call to an external service</text>
    <line x1="954" y1="610" x2="968" y2="610" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="972" y="614">streamed events back to the UI</text>
  </g>
</svg>
